[project]
name = "chatwoot-support-agent"
version = "0.1.0"
description = "LangGraph support agent for Chatwoot with human-in-the-loop approval, behind FastAPI"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "google-genai>=3.4.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
